# decision_phase2.yaml — Phase 2 run lock
# =============================================================================
# Created at Stage P2.0, 2026-08-26. This file freezes the architecture (§5),
# training infrastructure (§6), evaluation regimes (§7) and compute identity
# (§8) as they stand at the start of Phase 2, so the reproducibility audit
# (§1.2) can name the exact configuration and the exact machine.
#
# Mutating any value here re-triggers the §11 reviewer check and invalidates
# every result produced under the old value. Fields explicitly marked
# `status: pending_dgx_survey` are the only ones expected to be filled in
# later — by Step 7 of docs/PHASE2_EXECUTION_PLAN_DGX.md, before any GPU job.
# =============================================================================

