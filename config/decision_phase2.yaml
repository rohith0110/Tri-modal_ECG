            "A4 = R-peak + QRS-bound localization; B3 = 10-bin queries (2.5)"]
  round_3: ["signal = 1D ResNet-18 from scratch", "image = ResNet-50 ImageNet-1k",
            "text = TF-IDF + Bio-ClinicalBERT", "fusion = late concat + MLP",
            "primary signal = preprocessed, primary image = clean, primary lead set = 12-lead"]
  round_4: ["training-queue order (4.2)", "5 main tables + 5 main figures + 15 supplementary tables + 8 supplementary figures (4.3)"]
  round_5:
    - "5.1 fusion is end-to-end fine-tuned everywhere; frozen late fusion is a supplementary ablation only"
    - "5.2 A4/B3 fiducials are re-run with NeuroKit2 at build time — Phase 1 never cached R-peak arrays; the corrected Pan-Tompkins path must be reused"
    - "5.3 DGX-primary, laptop development-only"
    - "5.4 checkpoints best-only, evicted on completion; <= 5 GB resident"
    - "5.5 signals staged as int16 + per-record scale"
    - "5.6 oversized campaigns use aligned i.i.d. chunk cycling WITHIN each epoch"
    - "5.7 scope unchanged; nothing dropped to save compute or transfer"
  round_6:
    - "6.1 every measurement threshold reads the MACHINE measurement, never the
