# -----------------------------------------------------------------------------
# §5 — Architecture. Locked; no per-task tweaking. The only per-task
# variability allowed is head shape and the allowed input subset.
# -----------------------------------------------------------------------------
architecture:
  signal_encoder:
    name: ECGResNet1D18
    family: resnet18_1d
    pretrained: false
    trained_from_scratch: true
    embed_dim: 512
    stem: "Conv1d(n_leads, 64, kernel=15, stride=2, padding=7) + BN + ReLU + MaxPool1d(3, stride=2)"
    stages: [{blocks: 2, in: 64, out: 64, stride: 1}, {blocks: 2, in: 64, out: 128, stride: 2},
             {blocks: 2, in: 128, out: 256, stride: 2}, {blocks: 2, in: 256, out: 512, stride: 2}]
    block: "BasicBlock1D — 2 x (Conv1d k=7 / BN / ReLU) + identity skip; stride on the first conv of the first block in a stage"
    head: "AdaptiveAvgPool1d(1) -> flatten -> Linear(512, 512)"
    init: "Kaiming normal for Conv1d; ones/zeros for BN"
    lead_subsets: [1, 12]
    weights_shared_across_lead_subsets: false
    module: "_model_lib/signal_encoders.py"
  image_encoder:
    name: ImageResNet50
    backbone: "torchvision.models.resnet50(weights=IMAGENET1K_V2)"
    pretrained: true
    embed_dim: 512
    head: "final fc replaced with Linear(2048, 512)"
    normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    target_size:
      image_clean_lead2:      {h: 224, w: 672}
      image_scanlike_lead2:   {h: 224, w: 672}
      image_clean_12lead:     {h: 384, w: 512}
      image_scanlike_12lead:  {h: 384, w: 512}
    eval_transform: "PIL -> RGB -> Resize((target_h, target_w)) -> ToTensor -> Normalize"
    train_transform_when_augment: "Resize(1.05 x target) -> RandomCrop(target) -> ColorJitter(0.1, 0.1, 0.05, 0) -> RandomRotation(2 deg) -> ToTensor -> Normalize"
    transform_deviation:
      raised_at: "Stage P2.4, 2026-08-27"
      status: APPLIED
      spec_text: "§5.3 — 'Resize(short_side) -> CenterCrop(target_h, target_w)', with 224x672 said to preserve the 1:3 strip aspect ratio and 384x512 the 3x4 grid ratio"
      measured_render_sizes: {image_clean_lead2: "3600x750 (4.8:1)", image_scanlike_lead2: "1600x333 (4.8:1)", image_clean_12lead: "1016x504 (2.02:1)", image_scanlike_12lead: "1016x504 (2.02:1)"}
      problem: |
        The rendered images are not the aspect ratios §5.3 assumes. Short-side
        resize plus a centre crop would discard 37 % of the Lead-II strip — the
        first and last ~2 seconds of a 10-second ECG — and the outer lead columns
        of the 12-lead grid. That destroys the task rather than preprocessing it.
      decision: |
        Resize the FULL image into the locked target box. The stated intent (keep
        the whole ECG at the locked size) is honoured; target sizes and therefore
        the §6.6 VRAM budgets are unchanged. Anisotropic scaling rescales the time
        and voltage axes uniformly per axis and the network never sees a physical
        grid, so it is a geometry change, not an information loss.
        The augmented variant keeps §5.3's translation jitter by resizing 5 %
        larger and random-cropping back; colour jitter and the ±2° rotation are
        unchanged, and horizontal flip stays off.
      implemented_in: "_dataset_lib/task_dataset.py::build_image_transform"
      disclose_in_supplementary: true
    horizontal_flip: false
    horizontal_flip_rationale: "flipping an ECG image is medically invalid — it inverts the leads"
    augmentation_default: false
    augmentation_on_for: ["scan-like training", "mixed clean+scanlike ablation regimes (B2/B4/B6)"]
    module: "_model_lib/image_encoders.py"
  text_encoders:
    primary:
      name: BioClinicalBertEncoder
      hf_id: "emilyalsentzer/Bio_ClinicalBERT"
      params: "110M (BERT-base)"
      max_length: 512
      truncation: right
      pooling: "[CLS] hidden state, last layer"
      head: "Linear(768, 512)"
      embed_dim: 512
      license: "MIT via HuggingFace"
      model_sha: {value: "d5892b39a4adaed74b92212a44081509db72f87b", status: recorded,
                 recorded_at: "2026-08-27", recorded_by_stage: "P2.4",
                 note: "HF revision SHA at first fetch; it ships in the release package"}
      module: "_model_lib/text_encoders.py"
    supplementary:
      name: TfidfTextEncoder
      vectorizer: "sklearn TfidfVectorizer, sublinear_tf=true, max_df=0.95, min_df=10"
      vocabulary: "top 50,000 char n-grams (n in {2,3,4}) + word unigrams + word bigrams"
      fit_on: "TRAIN split only, frozen for val/test"
      projection: "TruncatedSVD to 512 dimensions, fit on TRAIN only"
      embed_dim: 512
      module: "_model_lib/text_encoders.py"
    both_trained_for_every_text_task: true
    paper_reporting: "Bio-ClinicalBERT primary, TF-IDF supplementary"
  fusion_head:
    name: LateFusionMLP
    style: late_concat_mlp
    concat_dim: 1539            # 3 x 512 embeddings + 3 presence bits
    hidden_dims: [1024, 512]
    activation: GELU
    dropout: 0.2
    missing_modality: "all-zeros embedding + a presence mask bit"
    shared_across_tasks: true
    per_task_difference: "only the final task_out layer"
    module: "_model_lib/fusion_heads.py"
  fusion_training_mode:
    mode: end_to_end_fine_tuned
    decision_round: "Round 5.1 (2026-08-26)"
    applies_to: "every primary multimodal result, every task"
    encoders_frozen: false
    supplementary_ablation: "frozen late fusion over the P2.5-P2.7 checkpoint embeddings — a near-free by-product, reported as 'end-to-end vs frozen late fusion'"
    rationale: |
      §9.9 previously said "frozen-or-fine-tuned" and never picked one. The
      answer is end-to-end everywhere. This is the more expensive option and
      the user accepted the cost explicitly.
  primary_modalities:
    signal: preprocessed
    image: clean
    lead_set: 12-lead
    lead2_reported_as: "Track-1, separately"

# -----------------------------------------------------------------------------
# §6 — Training infrastructure.
# -----------------------------------------------------------------------------
training:
  entry_point: "scripts/phase2_tasks_benchmark_and_paper/30_train.py"
  seeds: [42, 123, 456]
  determinism:
    set_seed: "random, numpy, torch, torch.cuda, PYTHONHASHSEED"
    cudnn_deterministic: true
    cudnn_benchmark: false
    throughput_cost_accepted: "~5-15 %"
    float32_matmul_precision: high
    module: "_train_lib/seed.py"
  optimizer:
    name: AdamW
    weight_decay: 0.01
    betas: [0.9, 0.999]
  learning_rates:
    head: 1.0e-3
    signal_backbone: 1.0e-3          # trained from scratch
    image_backbone: 1.0e-5           # pretrained
    text_backbone_layers: 1.0e-5
    text_embeddings: 1.0e-6
  schedule:
    warmup: "linear over the first 5 % of total steps"
    decay: "cosine to 0"
  epochs:
    signal_only: 30
    image_only: 30
    text_only: 20
    multimodal: 20
  early_stopping: {patience_epochs: 5, monitor: "val primary metric"}
  gradient_clipping: {type: global_norm, value: 1.0}
  gradient_accumulation:
    default_steps: 1
    a6_multimodal_steps: 4
    a6_rationale: "effective batch 64 for calibration stability"
  mixed_precision:
    policy: "bf16 where supported; fp16 + GradScaler fallback"
    dgx_a100_resolves_to: bf16
    laptop_smoke_path: "fp16 + GradScaler"
    recorded_per_run_in: "train_config.yaml snapshot"
  batch_sizes:
    signal_only_a2_b1_b3: 256
    signal_only_a4: 128
    signal_only_a6: 128
    image_only: 64
    text_only: 32
    multimodal: 16
    b2_regime_2: 256
    sizing_basis: "24 GB VRAM; A100 40/80 GB permits them unchanged; the laptop smoke path halves until it fits"
    abort_if_batch_le_1_after_halving: true
  loss_and_imbalance:
    multi_label_binary_a1_a6: {loss: BCEWithLogitsLoss, pos_weight: "(1 - prev) / prev from TRAIN, capped at 20"}
    multi_class_5_a3:         {loss: CrossEntropyLoss, class_weights: "TRAIN inverse-frequency", missing_class_downweighted: false}
    multi_class_3_a2_b1_b2:   {loss: CrossEntropyLoss, class_weights: none, optional_flag: "--balanced-sampler"}
    per_sample_sigmoid_a4:    {loss: BCEWithLogitsLoss, reduction: "summed over samples, normalized per study", pos_weight: 14}
    binary_verification_a5_b4_b6: {loss: BCEWithLogitsLoss, imbalance: "hard-negative oversampling; every batch contains >= 1 HARD_NEGATIVE_TEXT"}
    binary_corruption_b5:     {loss: BCEWithLogitsLoss, auxiliary: "5-class CE on the label head", balance: "50/50 by dataset design"}
    span_regression_b5:       {loss: SmoothL1Loss, normalization: "by report length", masked_when: "is_corrupted == False"}
    statistics_source: "TRAIN split only, always"
  threshold_selection:
    rule: "maximize Youden's J on the VALIDATION set"
    logged_to: "outputs/audit_reports/threshold_audit.md, per (task, arch, seed)"
    never_tuned_on_test: true
    a6_extra_thresholds: [0.05, 0.10, 0.20]
    a3_note: "per-class threshold is not meaningful for 35 softmax heads; macro-AUPRC is reported instead"
  calibration:
    applies_to: [A3_lab_abnormality, A6_risk_stratification]
    reliability_bins: 10
    bin_type: quantile
    metrics: [ECE, brier, log_loss]
    recalibration_trigger: "ECE > 0.05 at the val-optimal threshold"
    recalibration_order: [platt_scaling, isotonic_regression]
    fit_on: "VAL predictions only"
    scaler_is_part_of_the_model_artifact: true
    other_tasks: "compute ECE for completeness (supplementary) but do not auto-recalibrate"
    module: "_train_lib/calibration.py"
  checkpointing:
    contents: [model_state_dict, optimizer_state_dict, scheduler_state_dict, seed, epoch,
               global_step, val_metric_best, val_metric_best_epoch, rng_states, train_config_snapshot]
    rng_states: [python, numpy, torch, cuda]
    resume: "re-run the same command; the trainer detects checkpoint_last.pt and resumes"
    retention_policy: best_only_evicted_on_completion
    retention_decision_round: "Round 5.4 (supersedes Round 4.4's 150-200 GB budget)"
    resident_budget_gb: 5
    per_running_job: {checkpoint_last: "weights + optimizer + RNG, for resume",
                      checkpoint_best: "WEIGHTS ONLY, ~0.6 GB for fusion"}
    on_completion: "push checkpoint_best + test_predictions.parquet + train_log.jsonl off-node, then delete both local files"
    concurrency_cap_fusion_jobs: 3
    preemption: "checkpoint_last.pt written every N minutes, not only per epoch; re-pulled from off-node storage if a requeued job finds it missing"
  logging:
    canonical_machine_readable: "train_log.jsonl, one row per epoch"
    worker_transport: "per-PID file logging (Phase 1 §8.3)"
    silenced: [mixed_precision_warnings, h5py_thread_warnings, huggingface_tokenizer_warnings]

# -----------------------------------------------------------------------------
# §7 — Evaluation.
# -----------------------------------------------------------------------------
evaluation:
  entry_point: "scripts/phase2_tasks_benchmark_and_paper/31_eval.py"
  bootstrap:
    method: bca
    fallback: percentile
    fallback_when: "test-positive count < 100 per head"
    n_iter: 10000
    level: 0.95
    unit: patient
    resampling: "draw subject_ids WITH replacement; take all ECGs for each drawn subject"
    seed: 2026
    module: "_dataset_lib/bootstrap.py"
  per_task_outputs:
    prediction_file: "outputs/model_runs/<task>/<arch>/seed_<n>/test_predictions.parquet"
    result_file: "outputs/results/<task>.csv"
    summary_file: "outputs/results/all_tasks_summary.csv"
  reporting:
    - "primary metric +/- std across the 3 seeds"
    - "pooled-prediction bootstrap CI (concatenate seeds, then resample subjects)"
    - "per-subgroup metric: SQI tier, cart_id top-5, linkage tier, Plan A boundary flag"
  subgroup_keys: [sqi_tier, cart_id, link_tier, boundary_flag]
  primary_metric_policy: "AUPRC for imbalanced tasks (Round 1 lock); AUROC always reported as secondary"
  sensitivity:
    entry_point: "41_run_sensitivity.py"
    retrains_by_default: false
    retrain_required_for: ["TF-IDF vs Bio-ClinicalBERT", "raw vs preprocessed signal", "lead-II vs 12-lead"]
    output: "outputs/results/<task>_sensitivity_<sweep>.csv"
  eval_configs:
    default: "config/eval_configs/default.yaml"
    a4_fiducial: "config/eval_configs/A4_fiducial.yaml"
    a6_risk: "config/eval_configs/A6_risk.yaml"
    b2_robustness: "config/eval_configs/B2_robustness.yaml"
    cross_modal: "config/eval_configs/cross_modal.yaml"
  retrieval_pool: {size: 100, composition: "50 same-HR-bucket + 50 different-HR-bucket non-anchor subjects",
                   seed: "2026 + anchor_id", identical_across_seeds: true}

