# -----------------------------------------------------------------------------
# §8.2 — Data residency. The 50 GB quota cannot hold the 355 GB Phase 1 dataset,
# so Phase 2 never stages "the dataset" — it stages one campaign at a time.
# -----------------------------------------------------------------------------
data_residency:
  model: campaign
  launchers: "scripts/dgx_portability/"
  staging_bucket: "r2:trimodal-data (private, DGX read-only)"
  results_bucket: "r2:trimodal-results (private, DGX read-write)"
  never_on_dgx_only: "no Phase 2 artifact may exist only on the DGX; results are pushed off-node as they are produced"
  raw_mimic_never_leaves_laptop: true
  refuse_campaign_if_over_gb: 45
  signal_storage_format:
    on_laptop: "float32 + gzip-4 (Phase 1 materialisation, unchanged)"
    staged_to_dgx: "int16 + per-record scale factor + shuffle + gzip-4"
    measured_ratio: 0.40
    measured_size_12lead_preprocessed_gb: 56.7
    float32_size_12lead_preprocessed_gb: 141.8
    measured_max_abs_error: 1.1e-3
    signal_amplitude_reference: 70
    justification: "finer than the int16 ADC resolution of the source MIMIC-IV-ECG recordings — a storage change, not a precision compromise"
    empirical_proof_required: "Step 5 — train one task on both encodings and confirm the metrics agree; the comparison ships in the supplementary"
    proof_status: not_yet_run
  chunking:
    applies_when: "a campaign's data exceeds the quota"
    key: "hash of study_id"
    forbidden_keys: [subject_id, hadm_id, label, cart_id, time]
    modality_aligned: true
    alignment_requirement: "signal and image piece k cover the SAME studies — required by the fusion dataloader"
    applies_to_split: train
    cycling: within_epoch
    cycling_rule: "every epoch visits every piece in a reshuffled order, with a shuffle buffer inside each piece; two pieces resident at a time (train on k, prefetch k+1, evict k-1)"
    sequential_per_chunk_training: forbidden
    forbidden_rationale: "training to convergence on piece 1 then moving to piece 2 is block-local SGD and catastrophically forgets"
    documented_deviation: |
      Block-shuffled sampling is a documented deviation from global shuffling.
      It is recorded here, per §8.2 rule 2, and MUST be disclosed in the paper's
      supplementary material.

# -----------------------------------------------------------------------------
# §8.3 — Locked training-queue order for stages P2.5-P2.8 (Round 4.2).
# -----------------------------------------------------------------------------
training_queue:
  plan_a_order: [A2_measurement_blind, A1_ecg_diagnosis, A4_event_localization,
                 A3_lab_abnormality, A6_risk_stratification, A5_cross_modal_verification]
  plan_b_order: [B1_measurement_blind, B2_noise_robustness, B3_temporal_grounding,
                 B4_cross_modal_verification, B5_contradiction_detection, B6_difficulty_stratified]
  arch_tier_order: [algorithmic_baseline, signal_only, image_only, text_only, multimodal]
  seed_order: [42, 123, 456]
  rationale: |
    A2 is first and exercises the whole trainer stack on the simplest task, so
    failures show up early. A1/A4/A3/A6 each produce a defensible
    single-modality table before multimodal work begins. A5 is last in Plan A
    because it is the most architecture-complex. B1 reuses A2's signal-encoder
    code, B2 reuses B1's head with regime_2 augmentation, B3 starts the next
    code stream.

# -----------------------------------------------------------------------------
# Scope. Round 5.7: nothing is dropped to save compute or transfer.
# -----------------------------------------------------------------------------
scope:
  tasks: 12
  plan_a_role: primary
  plan_b_role: supplementary
  nothing_dropped_for_compute: true
  accepted_wall_clock: "weeks to months"
  estimated_runs: 180
  estimated_gpu_hours: 160
  estimated_dgx_wall_clock: "3-5 weeks, after ~2 weeks of laptop script development"
  audits_required_before_submission:
    - leakage_audit_phase2.md
    - split_audit_phase2.md
    - cohort_audit.md
    - threshold_audit.md
    - calibration_audit.md
    - sensitivity_audit.md
    - reproducibility_audit.md
  audit_gate: "all must be PASS; leakage/split/cohort must be PASS before ANY GPU time is spent"

