# =============================================================================
# icd_label_map_LOCKED.yaml — A1 (EHR diagnosis prediction) label map
# =============================================================================
# LOCKED at Stage P2.0 (Phase 2). Source of truth:
#   docs/PHASE2_SOURCE_OF_TRUTH.md §4.A.1.3
#   ECG_Benchmark_Neutral_Implementation_Plan_Plan_A_B.docx Appendix B
#   Round 2.1 decision (5 clinically meaningful ICD groups)
#
# Mutating this file after the lock invalidates every A1 result and
# re-triggers the §11 reviewer check.
#
# MATCHING CONTRACT (binding on 01_build_A1_ecg_diagnosis.py):
#   1. `diagnoses_icd.icd_code` is stripped of leading/trailing whitespace
#      before matching. `icd_version` is preserved and matched exactly —
#      an icd9_* pattern never matches an icd_version==10 row and vice versa.
#   2. `icd10_prefix` / `icd9_prefix` use str.startswith on the stripped code.
#      `icd10_exact` / `icd9_exact` use equality on the stripped code.
#   3. A study's label for a group is True if ANY ICD row on the linked
#      admission matches ANY pattern in that group. Groups are independent
#      (multi-label); a single code may contribute to more than one group.
#   4. The builder writes the resolved `long_title` list (joined from
#      `d_icd_diagnoses`) into `cohort_manifest.parquet` so the reviewer can
#      read every included code, per Appendix B ("Validate every included
#      pattern by joining to d_icd_diagnoses and reading the long_title list").
# =============================================================================

lock:
  locked_at: "2026-08-26"
  locked_by_stage: "P2.0"
  spec_section: "docs/PHASE2_SOURCE_OF_TRUTH.md §4.A.1.3"
  source_document: "Plan A/B Appendix B"
  decision_round: "Round 2.1"
  label_timing_classification: |
    A1 is ENCOUNTER-ASSOCIATED diagnosis prediction, not strict prospective
    diagnosis. The ICD code is assigned at the end of the admission, after the
    ECG. Phase 2 does NOT claim prospective diagnosis prediction (§4.A.1.3).

reference_tables:
  code_dictionary: "data/raw/ehr_cache/d_icd_diagnoses.parquet"
  assignments: "data/raw/ehr_cache/diagnoses_icd.parquet"
  ed_assignments: "data/raw/ehr_cache/ed_diagnosis.parquet"   # secondary analysis only

label_source_policy:
  primary: "hosp"
  secondary: "ed"
  pooling_allowed: false
  rationale: |
    Plan A/B §5.3 — "Do not mix hospital and ED labels without a provenance
    column." The primary A1 cohort is hospital ICD only. ED-linked diagnoses
    are a separate sensitivity run, always tagged in the `label_source` column.

groups:

  atrial_fibrillation_flutter:
    icd10_prefix: ["I48"]
    icd9_exact:   ["42731", "42732"]

  heart_failure_narrow:
    icd10_prefix:         ["I50"]
    icd10_exact_optional: ["I110", "I130", "I132"]
    icd9_prefix:          ["428"]

  acute_myocardial_infarction:
    icd10_prefix: ["I21", "I22"]
    icd9_prefix:  ["410"]

  conduction_disorder:
    icd10_prefix: ["I44", "I45"]
    icd9_prefix:  ["426"]

  ventricular_arrhythmia_or_arrest:
    icd10_prefix: ["I472", "I490", "I46"]
    icd9_prefix:  ["4271", "4274"]

