task: A1_ecg_diagnosis
arch_tier: multimodal_fusion_lead2
lead_subset: lead2
generated_by: _model_lib/model_configs.py --emit
spec: docs/PHASE2_SOURCE_OF_TRUTH.md §5.8
note: Architecture values are fixed by config/decision_phase2.yaml (§5). This file selects encoders, input
  modalities and head shape only.
head:
  n_out_total: 5
  heads:
  - name: label_atrial_fibrillation_flutter
    kind: binary
    n_out: 1
  - name: label_heart_failure_narrow
    kind: binary
    n_out: 1
  - name: label_acute_myocardial_infarction
    kind: binary
    n_out: 1
  - name: label_conduction_disorder
    kind: binary
    n_out: 1
  - name: label_ventricular_arrhythmia_or_arrest
    kind: binary
    n_out: 1
train:
  epochs: 20
  batch_size: 16
  accumulation_steps: 1
  patience: 5
  learning_rates:
    head: 0.001
    signal_backbone: 0.001
    image_backbone: 1.0e-05
    text_backbone_layers: 1.0e-05
    text_embeddings: 1.0e-06
signal:
  encoder: ECGResNet1D18
  n_leads: 1
  input_modality: preprocessed_lead2
  embed_dim: 512
image:
  encoder: ImageResNet50
  input_modality: image_clean_lead2
  target_h: 224
  target_w: 672
  augmentation: false
  embed_dim: 512
text:
  encoder: BioClinicalBert
  hf_id: emilyalsentzer/Bio_ClinicalBERT
  max_length: 512
  embed_dim: 512
fusion:
  head: LateFusionMLP
  hidden_dims:
  - 1024
  - 512
  dropout: 0.2
  mode: end_to_end_fine_tuned
