task: A5_cross_modal_verification
arch_tier: multimodal_fusion_notext_lead2
lead_subset: lead2
generated_by: _model_lib/model_configs.py --emit
spec: docs/PHASE2_SOURCE_OF_TRUTH.md §5.8
note: Architecture values are fixed by config/decision_phase2.yaml (§5). This file selects encoders, input
  modalities and head shape only.
head:
  n_out_total: 10
  heads:
  - name: y_match
    kind: binary
    n_out: 1
  - name: hr_label
    kind: multiclass
    n_out: 3
  - name: qrs_label
    kind: multiclass
    n_out: 3
  - name: qtc_label
    kind: multiclass
    n_out: 3
train:
  epochs: 20
  batch_size: 16
  accumulation_steps: 1
  patience: 5
  learning_rates:
    head: 0.001
    signal_backbone: 0.001
    image_backbone: 1.0e-05
    text_backbone_layers: 1.0e-05
    text_embeddings: 1.0e-06
signal:
  encoder: ECGResNet1D18
  n_leads: 1
  input_modality: preprocessed_lead2
  embed_dim: 512
image:
  encoder: ImageResNet50
  input_modality: image_clean_lead2
  target_h: 224
  target_w: 672
  augmentation: false
  embed_dim: 512
fusion:
  head: LateFusionMLP
  hidden_dims:
  - 1024
  - 512
  dropout: 0.2
  mode: end_to_end_fine_tuned
ablation: no_text
ablation_spec: Plan A/B §5.3 ablation 6 / Figure 2 / Appendix F — the leakage-controlled multimodal setting,
  trained without report text rather than evaluated with it zeroed
